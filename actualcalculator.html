<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>💖 Love Calculator</title>
  <style>
    body {
      font-family: "Comic Sans MS", cursive;
      background: linear-gradient(135deg, #ff9a9e, #fad0c4);
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      margin: 0;
    }

    .card {
      background: white;
      padding: 30px;
      border-radius: 15px;
      width: 350px;
      text-align: center;
      box-shadow: 0 10px 30px rgba(0,0,0,0.2);
    }

    h1 {
      color: #ff4d6d;
      margin-bottom: 25px;
    }

    .input-group {
      margin-bottom: 15px;
      text-align: left;
    }

    label {
      display: block;
      margin-bottom: 5px;
      color: #666;
      font-weight: bold;
    }

    input {
      width: 94%;
      padding: 10px;
      margin-bottom: 10px;
      border-radius: 8px;
      border: 1px solid #ccc;
      font-size: 16px;
    }

    input:focus {
      outline: none;
      border-color: #ff4d6d;
      box-shadow: 0 0 5px rgba(255, 77, 109, 0.3);
    }

    button {
      background: #ff4d6d;
      color: white;
      border: none;
      padding: 12px 25px;
      border-radius: 10px;
      font-size: 16px;
      cursor: pointer;
      margin-top: 10px;
      width: 100%;
      transition: background 0.3s;
    }

    button:hover {
      background: #e63950;
      transform: translateY(-2px);
      box-shadow: 0 5px 15px rgba(0,0,0,0.1);
    }

    .result {
      margin-top: 25px;
      font-size: 22px;
      color: #d6336c;
      padding: 15px;
      border-radius: 10px;
      background: #fff5f7;
      min-height: 60px;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
    }

    .small {
      font-size: 12px;
      color: gray;
      margin-top: 15px;
    }

    .heart {
      font-size: 30px;
      margin: 10px 0;
    }

    .love-message {
      font-size: 14px;
      color: #888;
      margin-top: 10px;
      font-style: italic;
    }
  </style>
</head>
<body>

<div class="card">
  <h1>💘 Love Calculator</h1>

  <div id="calculator">
    <div class="input-group">
      <label>Your Name 💁‍♀️</label>
      <input type="text" id="name1" placeholder="Enter your name">
    </div>
    
    <div class="input-group">
      <label>Partner's Name 💁‍♂️</label>
      <input type="text" id="name2" placeholder="Enter partner's name">
    </div>

    <button onclick="calculateLove()">Calculate Love 💕</button>
    
    <div class="result" id="result">
      Enter names and click calculate!
    </div>
    
    <div class="love-message" id="loveMessage"></div>
    
    <button onclick="shareResult()" style="background: #4CAF50; margin-top: 15px; display: none;" id="shareBtn">
      Share Result 📤
    </button>
    
    <p class="small">This is just for fun! 💖</p>
  </div>
</div>

<script>
  function calculateLove() {
    const name1 = document.getElementById("name1").value.trim();
    const name2 = document.getElementById("name2").value.trim();
    
    if (!name1 || !name2) {
      alert("Please enter both names! 😊");
      return;
    }
    
    if (name1.toLowerCase() === name2.toLowerCase()) {
      alert("Hmm... that's some serious self-love! 😂 Enter two different names!");
      return;
    }
    
    // More "realistic" calculation (still random but with some name-based logic)
    let baseScore = Math.floor(Math.random() * 41) + 60; // 60–100%
    
    // Add some name-based "logic" for fun
    const combinedNames = (name1 + name2).toLowerCase();
    let bonus = 0;
    
    // Check for vowels (more vowels = more love!)
    const vowels = (combinedNames.match(/[aeiou]/g) || []).length;
    bonus += Math.min(vowels * 2, 10);
    
    // Check for matching letters
    const set1 = new Set(name1.toLowerCase());
    const set2 = new Set(name2.toLowerCase());
    const commonLetters = [...set1].filter(letter => set2.has(letter)).length;
    bonus += commonLetters * 3;
    
    // Check name lengths (similar lengths = better match!)
    const lengthDiff = Math.abs(name1.length - name2.length);
    if (lengthDiff <= 3) bonus += 5;
    
    // Final calculation
    const loveScore = Math.min(100, baseScore + bonus);
    
    // Generate fun message
    let message = "";
    if (loveScore >= 90) {
      message = "🔥 Perfect Match! Soulmates alert! 💑";
    } else if (loveScore >= 80) {
      message = "💖 Amazing Chemistry! Great potential! 🌟";
    } else if (loveScore >= 70) {
      message = "😍 Strong Connection! Keep nurturing it! 🌹";
    } else if (loveScore >= 60) {
      message = "💕 Good Match! Worth exploring! 👫";
    } else {
      message = "💝 There's potential! Give it time! ⏳";
    }
    
    // Display result
    document.getElementById("result").innerHTML = `
      <div class="heart">💘</div>
      <b>${loveScore}%</b><br>
      <span style="font-size: 16px;">${name1} ❤️ ${name2}</span>
    `;
    
    document.getElementById("loveMessage").textContent = message;
    document.getElementById("shareBtn").style.display = "block";
    
    // Store result for sharing
    window.lastResult = { name1, name2, score: loveScore, message };
  }
  
  function shareResult() {
    if (!window.lastResult) return;
    
    const { name1, name2, score, message } = window.lastResult;
    const shareText = `💘 Love Calculator Result 💘\n\n${name1} ❤️ ${name2}\nLove Score: ${score}%\n${message}\n\nCheck yours at: ${window.location.href}`;
    
    // Try to use Web Share API if available
    if (navigator.share) {
      navigator.share({
        title: 'Love Calculator Result',
        text: shareText,
        url: window.location.href,
      })
      .catch(console.error);
    } else {
      // Fallback: copy to clipboard
      navigator.clipboard.writeText(shareText)
        .then(() => {
          alert('Result copied to clipboard! 📋\nYou can now share it anywhere!');
        })
        .catch(() => {
          // If clipboard fails, show the text
          prompt('Copy this text to share:', shareText);
        });
    }
  }
  
  // Allow pressing Enter to calculate
  document.addEventListener('keypress', function(e) {
    if (e.key === 'Enter') {
      calculateLove();
    }
  });
  
  // Focus on first input on page load
  document.getElementById("name1").focus();
</script>

</body>
</html>
