<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Ronaldo the GOAT? 😎</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
  body {
    height: 100vh;
    margin: 0;
    font-family: 'Segoe UI', sans-serif;
    overflow: hidden;
    display: flex;
    justify-content: center;
    align-items: center;
    background: linear-gradient(135deg, #ffecd2, #fcb69f);
    transition: background 1s ease;
  }

  .container {
    text-align: center;
    background: white;
    padding: 40px;
    border-radius: 16px;
    box-shadow: 0 10px 25px rgba(0,0,0,0.15);
    animation: popIn 0.6s ease;
  }

  @keyframes popIn {
    from { transform: scale(0.8); opacity: 0; }
    to { transform: scale(1); opacity: 1; }
  }

  h1 {
    font-size: 2rem;
    margin-bottom: 25px;
  }

  button {
    padding: 12px 26px;
    font-size: 18px;
    border: none;
    border-radius: 10px;
    cursor: pointer;
    transition: transform 0.2s ease, box-shadow 0.2s ease;
  }

  button:hover {
    transform: scale(1.1);
    box-shadow: 0 5px 15px rgba(0,0,0,0.2);
  }

  #yesBtn {
    background-color: #4CAF50;
    color: white;
    margin-right: 15px;
    animation: pulse 1.5s infinite;
  }

  #noBtn {
    background-color: #f44336;
    color: white;
    position: absolute;
  }

  @keyframes pulse {
    0%, 100% { transform: scale(1); }
    50% { transform: scale(1.2); }
  }

  .confetti {
    position: fixed;
    width: 10px;
    height: 10px;
    background-color: red;
    animation: fall 3s linear forwards;
  }

  @keyframes fall {
    to {
      transform: translateY(100vh) rotate(360deg);
      opacity: 0;
    }
  }

  .sparkle {
    position: fixed;
    width: 3px;
    height: 3px;
    background: white;
    border-radius: 50%;
    opacity: 0.8;
    animation: sparkleAnim linear infinite;
  }

  @keyframes sparkleAnim {
    from { transform: translateY(-10px) scale(1); opacity: 0.8; }
    to { transform: translateY(100vh) scale(0.5); opacity: 0; }
  }
</style>
</head>
<body>

<div class="container">
  <h1 id="question">Is Ronaldo the GOAT? 🐐</h1>
  <button id="yesBtn">Yes 😁</button>
  <button id="noBtn">No 😜</button>
</div>

<script>
  const noBtn = document.getElementById("noBtn");
  const yesBtn = document.getElementById("yesBtn");
  const question = document.getElementById("question");

  const funnyTexts = [
    "Haha, come on 😏",
    "Try again 😜",
    "Nope! Still can't 😎",
    "Too slow 😂",
    "Not today 😆"
  ];

  function moveNoButton() {
    const x = Math.random() * (window.innerWidth - noBtn.offsetWidth);
    const y = Math.random() * (window.innerHeight - noBtn.offsetHeight);

    noBtn.style.left = x + "px";
    noBtn.style.top = y + "px";

    noBtn.style.transform = "rotate(" + (Math.random() * 30 - 15) + "deg)";
    question.innerText = funnyTexts[Math.floor(Math.random() * funnyTexts.length)];
  }

  noBtn.addEventListener("mouseover", moveNoButton);
  noBtn.addEventListener("touchstart", moveNoButton);

  yesBtn.addEventListener("click", () => {
    question.innerText = "I know Cristiano is the GOAT! 😎❤️";
    noBtn.style.display = "none";
    yesBtn.innerText = "🎉 GOAT Confirmed!";

    // Change background
    document.body.style.background = "linear-gradient(135deg, #6a11cb, #2575fc)";

    launchConfetti();
    createSparkles();
  });

  function launchConfetti() {
    for (let i = 0; i < 50; i++) {
      const confetti = document.createElement("div");
      confetti.classList.add("confetti");
      confetti.style.left = Math.random() * 100 + "vw";
      confetti.style.backgroundColor = randomColor();
      confetti.style.animationDuration = Math.random() * 2 + 2 + "s";
      document.body.appendChild(confetti);
      setTimeout(() => confetti.remove(), 3000);
    }
  }

  function createSparkles() {
    for (let i = 0; i < 50; i++) {
      const sparkle = document.createElement("div");
      sparkle.classList.add("sparkle");
      sparkle.style.left = Math.random() * 100 + "vw";
      sparkle.style.animationDuration = (Math.random() * 3 + 2) + "s";
      document.body.appendChild(sparkle);
      setTimeout(() => sparkle.remove(), 5000);
    }
  }

  function randomColor() {
    const colors = ["#ff4d4d", "#ffd11a", "#4CAF50", "#3399ff", "#ff66cc"];
    return colors[Math.floor(Math.random() * colors.length)];
  }
</script>

</body>
</html>
